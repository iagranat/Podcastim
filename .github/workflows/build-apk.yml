name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate native Android)
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          # Build installable APK
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon || true

      - name: Prepare APKs for distribution
        run: |
          mkdir -p output_apks
          # Copy debug apk
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apks/podcastim-debug.apk
          fi
          # Copy release apk if generated
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output_apks/podcastim-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            # Sign unsigned release APK with debug keystore so it installs immediately
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            $BUILD_TOOLS sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out output_apks/podcastim-release-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          ls -la output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Podcastim-Android-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: output_apks/*.apk
          generate_release_notes: true
